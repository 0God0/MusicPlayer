    <use href="#slot" x="34" y="174"/><use href="#slot" x="52" y="174"/><use href="#slot" x="70" y="174"/>
    <use href="#slot" x="88" y="174"/><use href="#slot" x="106" y="174"/><use href="#slot" x="124" y="174"/>
    <use href="#slot" x="142" y="174"/><use href="#slot" x="160" y="174"/><use href="#slot" x="178" y="174"/>
    <use href="#slot" x="34" y="196"/><use href="#slot" x="52" y="196"/><use href="#slot" x="70" y="196"/>
    <use href="#slot" x="88" y="196"/><use href="#slot" x="106" y="196"/><use href="#slot" x="124" y="196"/>
    <use href="#slot" x="142" y="196"/><use href="#slot" x="160" y="196"/><use href="#slot" x="178" y="196"/>
