name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 17 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Start with an empty Gradle cache so missing generated Forge dependencies are detected.
      - name: Build and test from source
        shell: bash
        run: bash ./gradlew --no-daemon clean test build
      - uses: actions/upload-artifact@v4
        with:
          name: tf-music-${{ matrix.os }}
          path: |
            build/libs/*.jar
            !build/libs/*-slim.jar
          if-no-files-found: error
